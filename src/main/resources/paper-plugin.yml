name: OneVoid
version: '${version}'
main: com.extantape.onevoid.OneVoidPlugin
api-version: '26.1'
description: A OneBlock add-on. Walk in through the Waystation, ring your island's bell to leave, and turn what the void takes into rewards.
website: https://github.com/ExtantApe/OneVoid
# /onevoid is registered with Brigadier in code, so there is no commands section.
dependencies:
  server:
    # The OneBlock gate and the landing spot outside it.
    Waystation:
      load: BEFORE
      required: true
      join-classpath: true
    # MrMarL's OneBlock 1.6.4. Its plugin name is "Oneblock".
    Oneblock:
      load: BEFORE
      required: true
      join-classpath: true
    # Optional. Its circle permissions decide who may visit or team up with whom.
    Mayor:
      load: BEFORE
      required: false
permissions:
  onevoid.use:
    description: Use /onevoid to see the void meter and choose rewards. The way bell needs no permission.
    default: true
  onevoid.admin:
    description: /onevoid reload, status, meter and bell. Also lets an admin change things on any island.
    default: op
  onevoid.oneblock-commands:
    description: Type OneBlock's /ob commands. Players without it are pointed to the gate and the way bell instead.
    default: op

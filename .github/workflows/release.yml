name: Release

# A tag like v0.1.0 builds the plugin, checks that the tag matches the version in build.gradle.kts, and
# publishes a GitHub Release with the jar and the notes in docs/releases/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Leak check
        run: bash scripts/leak-check.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in build.gradle.kts"; exit 1
          fi
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "Missing docs/releases/$GITHUB_REF_NAME.md"; exit 1; }
      - run: ./gradlew build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/OneVoid-*.jar \
            --title "OneVoid $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
